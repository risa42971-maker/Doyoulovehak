<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For You</title>

<style>
body {
    margin: 0;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    font-family: Arial, sans-serif;
    overflow: hidden;
    text-align: center;
}

.container {
    background: rgba(255,255,255,0.9);
    padding: 30px;
    border-radius: 20px;
    box-shadow: 0 10px 25px rgba(0,0,0,0.2);
    position: relative;
}

h1 {
    font-size: 26px;
    color: #ff4d6d;
}

button {
    padding: 10px 25px;
    margin: 15px;
    border: none;
    border-radius: 25px;
    font-size: 18px;
    cursor: pointer;
    transition: 0.3s;
}

.yes {
    background: #ff4d6d;
    color: white;
}

.no {
    background: #888;
    color: white;
    position: absolute;
}

button:hover {
    transform: scale(1.1);
}
</style>
</head>

<body>

<div class="container">
    <h1 id="text"></h1>
    <button class="yes" onclick="goToLove()">Yes</button>
    <button class="no" id="noBtn">No</button>
</div>

<script>
const message = "Do you love HAK 😕?";
let i = 0;

function typeEffect() {
    if (i < message.length) {
        document.getElementById("text").innerHTML += message.charAt(i);
        i++;
        setTimeout(typeEffect, 50);
    }
}
typeEffect();

// Yes Redirect
function goToLove() {
    window.location.href = "https://youtu.be/TsCXMRVAnVE?si=Zl2JipGnZqgs8gxQ";
}

// No Button Move on Click
const noBtn = document.getElementById("noBtn");

noBtn.addEventListener("click", () => {
    const container = document.querySelector(".container");
    const maxX = container.offsetWidth - noBtn.offsetWidth;
    const maxY = container.offsetHeight - noBtn.offsetHeight;

    const randomX = Math.random() * maxX;
    const randomY = Math.random() * maxY;

    noBtn.style.left = randomX + "px";
    noBtn.style.top = randomY + "px";
});
</script>

</body>
</html>
